name: tutorconnect-milestone2
services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/tutorconnect?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      AI_ENABLED: ${AI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.8-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      AI_REMINDERS_ENABLED: ${AI_REMINDERS_ENABLED:-true}
      DB_USERNAME: tutorconnect
      DB_PASSWORD: tutorconnect-demo
      NOTIFICATION_URL: http://127.0.0.1:8080/internal/notifications
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN:-tutorconnect-local-notification-key}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: tutorconnect
      MYSQL_USER: tutorconnect
      MYSQL_PASSWORD: tutorconnect-demo
      MYSQL_ROOT_PASSWORD: root-demo-only
      TZ: UTC
    command: ["--default-time-zone=+00:00"]
    volumes:
      - tutorconnect-data:/var/lib/mysql
      - ./src/main/resources/schema-mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  tutorconnect-data:
