name: tutorconnect-milestone2
services:
  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: tutorconnect
      MYSQL_USER: tutorconnect
      MYSQL_PASSWORD: tutorconnect-demo
      MYSQL_ROOT_PASSWORD: root-demo-only
      TZ: UTC
    command: ["--default-time-zone=+00:00"]
    volumes:
      - tutorconnect-data:/var/lib/mysql
      - ./src/main/resources/schema-mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  tutorconnect-data:
