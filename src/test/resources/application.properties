spring.application.name=tutorconnect-test
spring.datasource.url=jdbc:h2:mem:tutorconnect_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql,classpath:notification-schema.sql
spring.sql.init.data-locations=classpath:reset.sql,classpath:seed.sql
server.error.include-stacktrace=never
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'

notifications.enabled=false
notifications.recovery.enabled=false
spring.datasource.hikari.connection-timeout=1000
ai.reminders.scheduled=false
# Never contact a live model just because the developer exported an AI key.
ai.enabled=false
