spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3307/tutorconnect_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${TEST_DB_USERNAME:tutorconnect}
spring.datasource.password=${TEST_DB_PASSWORD:tutorconnect-demo}
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.sql.init.schema-locations=classpath:schema-mysql.sql
spring.sql.init.data-locations=classpath:reset.sql,classpath:seed.sql
