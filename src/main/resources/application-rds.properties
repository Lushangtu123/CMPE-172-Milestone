# Cloud profile: no embedded credentials or data reset. All tables use IF NOT EXISTS.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
spring.datasource.url=jdbc:mysql://${RDS_HOSTNAME}:${RDS_PORT:3306}/${RDS_DB_NAME:tutorconnect}?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=${RDS_TRUSTSTORE_URL:file:/app/rds-ca.p12}&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=changeit&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-mysql.sql
spring.sql.init.data-locations=
# Override the local-only fallback token in the cloud.
notifications.service-token=${NOTIFICATION_SERVICE_TOKEN}
notifications.url=http://127.0.0.1:${server.port}/internal/notifications
