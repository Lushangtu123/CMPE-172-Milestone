<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My appointments · TutorConnect</title><link rel="stylesheet" href="/assets/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main id="main-content" tabindex="-1" class="task-page"><section class="page-heading"><div><h1>My appointments</h1></div><a class="button" href="/slots">Find another session ↗</a></section><p class="notice" th:if="${param.cancelled}">Your appointment has been cancelled.</p><h2>Coming up</h2><p class="empty" th:if="${upcoming.isEmpty()}">You have no upcoming appointments.</p><article class="appointment" th:each="a:${upcoming}"><div><span class="tag" th:text="${a.status}"></span><h3 th:text="${a.serviceName}"></h3><p th:text="${a.providerName}"></p></div><div class="when"><strong th:text="${#temporals.format(a.startTime,'EEE, MMM d yyyy')}"></strong><span th:text="${#temporals.format(a.startTime,'HH:mm') + ' UTC'}"></span></div><a class="outline danger" th:href="@{/customer/appointments/{id}/cancel(id=${a.appointmentId})}">Cancel appointment</a></article><h2 class="history-heading">Appointment history</h2><p class="empty" th:if="${history.isEmpty()}">Your past and cancelled appointments will appear here.</p><article class="appointment" th:each="a:${history}"><div><span class="tag" th:text="${a.status}"></span><h3 th:text="${a.serviceName}"></h3><p th:text="${a.providerName}"></p></div><div class="when"><strong th:text="${#temporals.format(a.startTime,'EEE, MMM d yyyy')}"></strong><span th:text="${#temporals.format(a.startTime,'HH:mm') + ' UTC'}"></span></div></article></main><footer>LEARN WITH PURPOSE <span>TutorConnect · All appointment times are UTC</span></footer></body></html>
