<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TutorConnect</title><link rel="stylesheet" href="/assets/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main id="main-content" tabindex="-1"><section class="narrow"><a class="back" href="/slots">← All sessions</a><p class="eyebrow">ONE STEP CLOSER</p><h1>Make time<br><em>for your goals.</em></h1><section class="panel"><span class="tag" th:text="${slot.durationMinutes + ' MIN SESSION'}"></span><h2 th:text="${slot.serviceName}"></h2><p th:text="${slot.description}"></p><dl><dt>Your tutor</dt><dd th:text="${slot.providerName}"></dd><dt>Date &amp; time (UTC)</dt><dd th:text="${#temporals.format(slot.startTime,'EEE, MMM d yyyy · HH:mm')}"></dd></dl><form th:action="@{/customer/appointments}" method="post"><input type="hidden" name="slotId" th:value="${slot.slotId}"><input type="hidden" name="serviceId" th:value="${slot.serviceId}"><button class="button full">Confirm appointment <span>↗</span></button></form><p class="muted">You can cancel a future appointment from My appointments.</p></section></section></main><footer>LEARN WITH PURPOSE <span>TutorConnect · All appointment times are UTC</span></footer></body></html>
