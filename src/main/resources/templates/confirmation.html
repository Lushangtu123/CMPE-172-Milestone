<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TutorConnect</title><link rel="stylesheet" href="/assets/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main id="main-content" tabindex="-1"><section class="narrow"><p class="eyebrow">YOU'RE ALL SET</p><h1>Progress is<br><em>on the calendar.</em></h1><section class="panel"><span class="tag" th:text="${appointment.status}"></span><h2 th:text="${appointment.serviceName}"></h2><p th:text="${'With ' + appointment.providerName}"></p><p th:text="${#temporals.format(appointment.startTime,'EEE, MMM d yyyy · HH:mm') + ' UTC'}"></p><p class="muted" th:text="${'Appointment #' + appointment.appointmentId}"></p><a class="button full" href="/customer/appointments">My appointments <span>↗</span></a></section></section></main><footer>LEARN WITH PURPOSE <span>TutorConnect · All appointment times are UTC</span></footer></body></html>
