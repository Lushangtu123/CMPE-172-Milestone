spring.application.name=tutorconnect
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/tutorconnect?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:tutorconnect}
spring.datasource.password=${DB_PASSWORD:tutorconnect-demo}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
server.error.include-stacktrace=never
server.error.include-message=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Bounded health probe and commit-then-notify HTTP gateway.
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.validation-timeout=1000
notifications.url=${NOTIFICATION_URL:http://127.0.0.1:${server.port:8080}/internal/notifications}
notifications.service-token=${NOTIFICATION_SERVICE_TOKEN:tutorconnect-local-notification-key}
notifications.connect-timeout=200ms
notifications.request-timeout=300ms
notifications.max-attempts=3
notifications.retry-delay=25ms
notifications.enabled=true
notifications.recovery.enabled=true
notifications.recovery-delay=15000
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Gemini Developer API only: no Vertex project-id/location. Existing app works without a key.
ai.enabled=${AI_ENABLED:false}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
ai.chat-model=${GEMINI_CHAT_MODEL:gemini-3.8-flash}
ai.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
ai.reminders.scheduled=${AI_REMINDERS_ENABLED:true}
ai.reminders.delay=60000
