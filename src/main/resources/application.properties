spring.application.name=tutorconnect

# Embedded H2. Repositories use JdbcTemplate. This project does not use JPA or any ORM.
spring.datasource.url=jdbc:h2:mem:tutorconnect;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create tables from schema.sql, then load sample rows from seed.sql.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql
