spring.application.name=tutorconnect
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/tutorconnect?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:tutorconnect}
spring.datasource.password=${DB_PASSWORD:tutorconnect-demo}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
server.error.include-stacktrace=never
server.error.include-message=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
